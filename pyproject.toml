[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wifi-analyzer-pro"
version = "1.0.7"
description = "Local-first Wi-Fi discovery, RF analysis and network diagnostics"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "NetCore Technologies" }]
keywords = ["wifi", "wireless", "network", "rf", "diagnostics"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
  "psutil>=7.2.2",
  "cryptography>=48.0.0",
  "tzdata>=2025.2",
  "paho-mqtt>=2.1.0,<3",
]

[project.urls]
Homepage = "https://github.com/NetCore-Technologies/wifi-analyzer-pro"
Repository = "https://github.com/NetCore-Technologies/wifi-analyzer-pro"
Issues = "https://github.com/NetCore-Technologies/wifi-analyzer-pro/issues"

[project.scripts]
wifi-analyzer = "wifi_analyzer_backend.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["wifi_analyzer_backend*"]
namespaces = true

[tool.setuptools.package-data]
"wifi_analyzer_backend.feature_plugins" = ["FEATURES.json"]
"wifi_analyzer_backend" = ["requirements.txt"]
