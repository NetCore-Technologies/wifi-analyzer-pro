name: Quality gates

on:
  push:
    branches: [main, 'latest/development']
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify app and product-site entry points
        shell: bash
        run: |
          set -euo pipefail
          test -s package-lock.json || { echo "package-lock.json is missing. Run npm install locally and commit the lockfile." >&2; exit 1; }
          grep -Fq 'id="root"' index.html
          grep -Fq 'src/main.jsx' index.html
          test -s site/index.html
          grep -Fq 'Wireless intelligence platform' site/index.html
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
      - run: test -s dist/index.html

  backend:
    name: Python backend tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: wifi_analyzer_backend/requirements.txt
      - run: python -m pip install -r wifi_analyzer_backend/requirements.txt
      - run: python -m compileall -q wifi_analyzer_backend tests
      - run: python -m unittest discover -s tests -v
