name: Quality gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit the complete npm lockfile
        run: npm audit --audit-level=high
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pinned Python dependency auditor
        run: python -m pip install --disable-pip-version-check pip-audit==2.10.1
      - name: Audit Python runtime requirements and their resolved dependencies
        run: pip-audit --progress-spinner off --requirement wifi_analyzer_backend/requirements.txt
  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify app and product-site entry points
        shell: bash
        run: |
          set -euo pipefail
          test -s package-lock.json || { echo "package-lock.json is missing. Run npm install locally and commit the lockfile." >&2; exit 1; }
          grep -Fq 'id="root"' index.html
          grep -Fq 'src/main.jsx' index.html
          test -s site/index.html
          grep -Fq 'Wireless intelligence platform' site/index.html
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run test:frontend
      - run: npm run build
      - run: test -s dist/index.html

  backend:
    name: Python backend tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: wifi_analyzer_backend/requirements.txt
      - run: python -m pip install -r wifi_analyzer_backend/requirements.txt
      - run: python -m compileall -q wifi_analyzer_backend tests
      - run: python -m unittest discover -s tests -v

  container:
    name: Docker image build (non-root runtime)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate customer Compose deployment
        run: docker compose --env-file .env.example -f compose.yaml config --quiet
      - name: Validate isolated vendor licensing deployment
        shell: bash
        run: |
          set -euo pipefail
          printf 'dGVzdA==\\n' > /tmp/vendor-license-signing-key.b64
          chmod 600 /tmp/vendor-license-signing-key.b64
          cat > /tmp/vendor-compose.env <<'EOF'
          WIFI_ANALYZER_IMAGE=wifi-analyzer-pro:ci
          WIFI_ANALYZER_LICENSE_SERVICE_PUBLIC_URL=https://licenses.example.com
          WIFI_ANALYZER_LICENSE_BIND_ADDRESS=127.0.0.1
          WIFI_ANALYZER_VENDOR_LICENSE_KEY_ID=primary
          WIFI_ANALYZER_VENDOR_LICENSE_SIGNING_PRIVATE_KEY_FILE=/tmp/vendor-license-signing-key.b64
          WIFI_ANALYZER_VENDOR_STRIPE_SECRET_KEY=sk_test_ci12345678
          WIFI_ANALYZER_VENDOR_STRIPE_WEBHOOK_SECRET=whsec_ci12345678
          WIFI_ANALYZER_VENDOR_STRIPE_PRICE_PRO=price_ci_pro1234
          WIFI_ANALYZER_VENDOR_STRIPE_PRICE_BUSINESS=
          WIFI_ANALYZER_VENDOR_STRIPE_PRICE_ENTERPRISE=
          WIFI_ANALYZER_VENDOR_ADMIN_TOKEN=vendor-admin-ci-token-0123456789abcdef
          EOF
          docker compose --env-file /tmp/vendor-compose.env -f compose.vendor-licensing.yaml config --quiet
      - name: Build the production container image
        run: docker build --pull --tag wifi-analyzer-pro:ci .
