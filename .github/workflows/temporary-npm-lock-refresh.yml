name: Temporary npm lockfile refresh

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temporary-npm-lock-refresh.yml"

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Generate lockfile from package.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Publish generated lockfile artifact
        uses: actions/upload-artifact@v4
        with:
          name: wifi-analyzer-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
      - name: Verify clean install and frontend production build
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Commit the verified lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
            npm ci --no-audit --no-fund
            npm run build
            git add package-lock.json
            if git diff --cached --quiet; then
              echo "package-lock.json is already synchronised"
              exit 0
            fi
            git commit -m "fix(deps): synchronise npm lockfile"
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          echo "Could not push the refreshed lockfile after three attempts" >&2
          exit 1
