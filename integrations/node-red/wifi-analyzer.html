<script type="text/javascript">
RED.nodes.registerType('wifi-analyzer-config', {
  category: 'config',
  defaults: {
    name: { value: '' },
    baseUrl: { value: 'http://127.0.0.1:199', required: true }
  },
  credentials: {
    bearerToken: { type: 'password' }
  },
  label: function () { return this.name || this.baseUrl || 'WiFi Analyzer Pro'; }
});

RED.nodes.registerType('wifi-analyzer-scan', {
  category: 'network',
  color: '#b8d8e8',
  defaults: {
    name: { value: '' },
    server: { value: '', type: 'wifi-analyzer-config', required: true },
    timeoutMs: { value: 15000, validate: RED.validators.number() }
  },
  inputs: 1,
  outputs: 1,
  icon: 'font-awesome/fa-wifi',
  label: function () { return this.name || 'WiFi Analyzer Pro Scan'; }
});

RED.nodes.registerType('wifi-analyzer-feature', {
  category: 'network',
  color: '#b8d8e8',
  defaults: {
    name: { value: '' },
    server: { value: '', type: 'wifi-analyzer-config', required: true },
    slug: { value: '', required: true },
    timeoutMs: { value: 15000, validate: RED.validators.number() }
  },
  inputs: 1,
  outputs: 1,
  icon: 'font-awesome/fa-cogs',
  label: function () { return this.name || 'WiFi Analyzer Pro Feature'; }
});

RED.nodes.registerType('wifi-analyzer-telemetry', {
  category: 'network',
  color: '#b8d8e8',
  defaults: {
    name: { value: '' },
    server: { value: '', type: 'wifi-analyzer-config', required: true },
    siteId: { value: '' },
    days: { value: 7, validate: RED.validators.number() },
    limit: { value: 5000, validate: RED.validators.number() },
    timeoutMs: { value: 15000, validate: RED.validators.number() }
  },
  inputs: 1,
  outputs: 1,
  icon: 'font-awesome/fa-line-chart',
  label: function () { return this.name || 'WiFi Analyzer Pro Telemetry'; }
});

RED.nodes.registerType('wifi-analyzer-alerts', {
  category: 'network',
  color: '#b8d8e8',
  defaults: {
    name: { value: '' },
    server: { value: '', type: 'wifi-analyzer-config', required: true },
    siteId: { value: '', required: true },
    timeoutMs: { value: 15000, validate: RED.validators.number() }
  },
  inputs: 1,
  outputs: 1,
  icon: 'font-awesome/fa-bell',
  label: function () { return this.name || 'WiFi Analyzer Pro Alerts'; }
});

RED.nodes.registerType('wifi-analyzer-catalog', {
  category: 'network',
  color: '#b8d8e8',
  defaults: {
    name: { value: '' },
    server: { value: '', type: 'wifi-analyzer-config', required: true },
    timeoutMs: { value: 15000, validate: RED.validators.number() }
  },
  inputs: 1,
  outputs: 1,
  icon: 'font-awesome/fa-list',
  label: function () { return this.name || 'WiFi Analyzer Pro Feature Catalog'; }
});
</script>

<script type="text/html" data-template-name="wifi-analyzer-config">
  <div class="form-row">
    <label for="node-config-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-config-input-name" placeholder="WiFi Analyzer Pro">
  </div>
  <div class="form-row">
    <label for="node-config-input-baseUrl"><i class="fa fa-globe"></i> Base URL</label>
    <input type="text" id="node-config-input-baseUrl" placeholder="https://wifi-analyzer.example.internal">
  </div>
  <div class="form-row">
    <label for="node-config-input-bearerToken"><i class="fa fa-key"></i> API token</label>
    <input type="password" id="node-config-input-bearerToken" autocomplete="new-password">
  </div>
  <div class="form-tips">
    Use HTTPS for remote endpoints. Plain HTTP is accepted only for a loopback API on the same host.
    The token is stored as a Node-RED credential and is never placed in a flow message.
  </div>
</script>
<script type="text/html" data-help-name="wifi-analyzer-config">
  <p>Shared, credential-protected connection to WiFi Analyzer Pro.</p>
</script>
