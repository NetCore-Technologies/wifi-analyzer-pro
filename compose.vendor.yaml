name: wifi-analyzer-pro-vendor

services:
  licensing-control-plane:
    image: ${WIFI_ANALYZER_VENDOR_IMAGE:-wifi-analyzer-pro-licensing:local}
    build:
      context: .
      dockerfile: Dockerfile.licensing
    container_name: wifi-analyzer-vendor-licensing
    restart: unless-stopped
    init: true
    user: "10001:10001"
    env_file:
      - .env.vendor
    environment:
      HOME: /home/wifi-licensing
      WIFI_ANALYZER_LICENSE_SERVICE_HOST: 0.0.0.0
      WIFI_ANALYZER_LICENSE_SERVICE_PORT: "1999"
      WIFI_ANALYZER_VENDOR_LICENSE_DB: /home/wifi-licensing/.local/state/vendor-license/vendor-licensing.sqlite3
      WIFI_ANALYZER_VENDOR_LICENSE_SIGNING_PRIVATE_KEY_FILE: /run/secrets/vendor-license-signing-key
    ports:
      # Public TLS must terminate at a trusted reverse proxy. Never expose this
      # plain HTTP service directly on a public interface.
      - "${WIFI_ANALYZER_LICENSE_BIND_ADDRESS:-127.0.0.1}:1999:1999"
    volumes:
      - vendor-license-state:/home/wifi-licensing/.local/state/vendor-license
      - "${WIFI_ANALYZER_VENDOR_LICENSE_SIGNING_PRIVATE_KEY_FILE:?Set vendor signing key path}:/run/secrets/vendor-license-signing-key:ro"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 1.0
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:1999/health', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  vendor-license-state:
